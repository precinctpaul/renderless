name: Deploy relay to Cloudflare

# Redeploys the Cloudflare relay Worker whenever relay/ changes on main.
# Needs a repo secret CLOUDFLARE_API_TOKEN (Cloudflare "Edit Cloudflare Workers" token)
# and a repo variable CLOUDFLARE_ACCOUNT_ID. Without the token the job skips with a notice.

on:
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - '.github/workflows/deploy-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip when no Cloudflare token is configured
        if: env.HAS_TOKEN != 'true'
        working-directory: .
        run: echo "::notice::CLOUDFLARE_API_TOKEN secret is not set; skipping relay deploy."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - if: env.HAS_TOKEN == 'true'
        run: npm ci
      - if: env.HAS_TOKEN == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
